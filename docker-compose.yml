services:
  postgres:
    image: postgres:16-alpine
    container_name: job_intel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpassword}
      POSTGRES_DB: ${POSTGRES_DB:-job_intelligence_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobuser} -d ${POSTGRES_DB:-job_intelligence_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job_intel_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: job_intel_api
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: job_intel_worker
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      api:
        condition: service_started

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: job_intel_scheduler
    restart: always
    command: celery -A app.celery_app beat -l info --scheduler celery.beat:PersistentScheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://jobuser:jobpassword@postgres:5432/job_intelligence_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_intel_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
